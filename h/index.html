// The hand-off page, in the browser.
//
// A sticker on a hub carries `https://tintronix-lab.github.io/h?d=...`. On an
// iPhone that URL opens the app (applinks) or the App Clip; everywhere else —
// Android, a laptop, a Mac, a QR reader that just opens Safari — it lands
// here, and this file is the whole reader. It decodes the same bytes
// `HandoffCodec` wrote, with the same bounds, and says the same words in the
// same nine languages. Nothing is fetched: the report is entirely in the URL.
//
// Kept honest by `tools/check_handoff_page.py`, which reads the Swift and this
// file and fails when the two ends stop agreeing.

'use strict'

const Handoff = (() => {
  // Mirrors of HandoffCodec's own bounds. The gate asserts these equal the
  // Swift values — they are a defence against a stranger's URL, so drifting
  // apart quietly is the failure that matters.
  const URL_LIMIT = 2300
  const INFLATE_LIMIT = 256 * 1024
  const CURRENT_VERSION = 1

  // HandoffPayload.CodingKeys. The gate reads the Swift enum and fails if a
  // case is missing here, so a field added to the payload cannot silently go
  // unread on the web.
  const FIELDS = {
    v: 'version', t: 'inspectedAt', f: 'firm', n: 'site', g: 'grade', s: 'score',
    d: 'deviceCount', o: 'offlineCount', w: 'weakCount',
    r: 'routerCount', R: 'rooms', i: 'issues', a: 'accepted', D: 'demo', F: 'findings',
  }
  const ROOM_FIELDS = { name: 'name', deviceCount: 'deviceCount', offlineCount: 'offlineCount', weakCount: 'weakCount' }
  // HandoffPayload.Finding.CodingKeys (#283), checked by the gate like FIELDS.
  const FINDING_FIELDS = { r: 'rule', n: 'matched', c: 'channels' }

  // NetworkHealthScore.band(for:). Grade and colour both come from the score,
  // not from the letter on the sticker, for the same reason the app does it:
  // one definition.
  const BANDS = [
    { min: 90, grade: 'A', tone: 'a' },
    { min: 75, grade: 'B', tone: 'b' },
    { min: 60, grade: 'C', tone: 'c' },
    { min: 40, grade: 'D', tone: 'd' },
    { min: -Infinity, grade: 'F', tone: 'f' },
  ]

  function band(score) {
    return BANDS.find(b => score >= b.min)
  }

  function base64url(text) {
    let s = String(text).replace(/-/g, '+').replace(/_/g, '/')
    while (s.length % 4 !== 0) s += '='
    let binary
    try { binary = atob(s) } catch { return null }
    const out = new Uint8Array(binary.length)
    for (let i = 0; i < binary.length; i++) out[i] = binary.charCodeAt(i)
    return out
  }

  // Raw DEFLATE. Apple's COMPRESSION_ZLIB emits RFC 1951 with no zlib header,
  // which is exactly what 'deflate-raw' reads — 'deflate' would reject it.
  async function inflate(bytes) {
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))
    const reader = stream.getReader()
    const chunks = []
    let total = 0
    for (;;) {
      const { done, value } = await reader.read()
      if (done) break
      total += value.length
      // The limit is on the sum, not on one chunk: a small URL can describe a
      // very large expansion, and only the total bounds that.
      if (total > INFLATE_LIMIT) { await reader.cancel(); throw new Error('tooLarge') }
      chunks.push(value)
    }
    const out = new Uint8Array(total)
    let at = 0
    for (const c of chunks) { out.set(c, at); at += c.length }
    return out
  }

  function hex(buffer) {
    return [...new Uint8Array(buffer)].map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase()
  }

  /// The first eight hex digits of SHA-256 over the raw public key, in two
  /// groups — the same string the app prints, so it matches the installer's card.
  async function fingerprint(keyBytes) {
    const digest = await crypto.subtle.digest('SHA-256', keyBytes)
    const h = hex(digest).slice(0, 8)
    return h.slice(0, 4) + ' ' + h.slice(4)
  }

  /// 'verified' | 'unverified' | 'uncheckable'. The third is not a verdict and
  /// must never be shown as one: a browser without Ed25519 has not found the
  /// signature wanting, it has declined to look.
  async function verify(data, k, s) {
    if (!k || !s) return { state: 'unverified' }
    const keyBytes = base64url(k)
    const sigBytes = base64url(s)
    if (!keyBytes || !sigBytes || keyBytes.length !== 32) return { state: 'unverified' }
    let key
    try {
      key = await crypto.subtle.importKey('raw', keyBytes, { name: 'Ed25519' }, false, ['verify'])
    } catch {
      return { state: 'uncheckable' }
    }
    let ok = false
    try {
      ok = await crypto.subtle.verify({ name: 'Ed25519' }, key, sigBytes, data)
    } catch {
      return { state: 'uncheckable' }
    }
    if (!ok) return { state: 'unverified' }
    return { state: 'verified', fingerprint: await fingerprint(keyBytes) }
  }

  /// The three parameters, from the query or the fragment. The app writes a
  /// query today; a fragment never reaches the server at all, and a link that
  /// used one would still have to open here, so both are read.
  function params(href) {
    const url = new URL(href)
    const from = url.searchParams
    if (from.get('d')) return from
    const hash = url.hash.startsWith('#') ? url.hash.slice(1) : url.hash
    return new URLSearchParams(hash)
  }

  /// Mirrors HandoffCodec.outcome(of:): 'empty' for a link carrying nothing,
  /// 'failed' for one that is ours and unreadable, 'newer' for one a later
  /// version wrote, 'ok' for a report. Never a fabricated home — showing
  /// invented devices to someone whose whole assumption is "this is my house"
  /// is a worse answer than an error.
  async function read(href) {
    const q = params(href)
    const d = q.get('d')
    if (!d) return { outcome: 'empty' }
    const data = base64url(d)
    if (!data) return { outcome: 'failed' }
    // Bounded before anything reads it, and before the signature is checked —
    // decoding has to happen first to have something to verify, so the
    // signature is no defence here at all.
    if (data.length > URL_LIMIT) return { outcome: 'failed' }
    let json
    try {
      json = JSON.parse(new TextDecoder().decode(await inflate(data)))
    } catch {
      return { outcome: 'failed' }
    }
    if (json === null || typeof json !== 'object' || Array.isArray(json)) return { outcome: 'failed' }
    const payload = {}
    for (const [short, name] of Object.entries(FIELDS)) payload[name] = json[short]
    if (typeof payload.version !== 'number') return { outcome: 'failed' }
    if (payload.version > CURRENT_VERSION) return { outcome: 'newer' }
    if (typeof payload.score !== 'number' || typeof payload.inspectedAt !== 'number') return { outcome: 'failed' }
    payload.rooms = Array.isArray(payload.rooms) ? payload.rooms.map(room => {
      const out = {}
      for (const [key, name] of Object.entries(ROOM_FIELDS)) out[name] = room && room[key]
      return out
    }) : []
    payload.issues = Array.isArray(payload.issues) ? payload.issues.filter(i => typeof i === 'string') : []
    // What was found, by rule (#283). Taken whole or not at all: one entry
    // this page cannot read sends the reader back to the installer's words,
    // never to a list with a hole in it.
    const raw = payload.findings
    payload.findings = Array.isArray(raw) && raw.length && raw.every(f =>
      f && typeof f === 'object' && typeof f.r === 'string' && Number.isInteger(f.n) &&
      (f.c === undefined || (Array.isArray(f.c) && f.c.every(Number.isInteger))))
      ? raw.map(f => {
          const out = {}
          for (const [key, name] of Object.entries(FINDING_FIELDS)) out[name] = f[key]
          out.channels = out.channels || []
          return out
        })
      : null
    return { outcome: 'ok', payload, verification: await verify(data, q.get('k'), q.get('s')) }
  }

  /// The findings to say, as [string id, value] pairs, when every rule the
  /// sticker names has a sentence on this page (`has(id)`); null sends the
  /// page back to the installer's own words (#283). A channel overlap names
  /// its channels as the app does, "CH15, CH20".
  function findingLines(payload, has) {
    const findings = payload.findings
    if (!findings || !findings.every(f => has('finding.' + f.rule))) return null
    return findings.map(f => ['finding.' + f.rule,
      f.rule === 'channelOverlap' ? f.channels.map(c => 'CH' + c).join(', ') : f.matched])
  }

  /// The best of the reader's languages that the page actually speaks.
  /// `navigator.languages` is ordered by preference, and a regional tag
  /// ("de-AT", "pt-PT") belongs with its base language rather than with
  /// English — which is the whole difference between a customer reading their
  /// report and a customer reading someone else's language.
  function pickLanguage(preferred, langs) {
    const have = new Set(langs)
    for (const tag of preferred) {
      if (have.has(tag)) return tag
      const base = String(tag).split('-')[0]
      const match = langs.find(l => l === base || l.split('-')[0] === base)
      if (match) return match
    }
    return 'en'
  }

  return { read, band, pickLanguage, base64url, fingerprint, findingLines, URL_LIMIT, INFLATE_LIMIT, CURRENT_VERSION, FIELDS, FINDING_FIELDS, BANDS }
})()

if (typeof module !== 'undefined' && module.exports) module.exports = Handoff

// Drawing the hand-off report. `handoff.js` turns the URL into values; this
// turns values into a page, in the reader's language rather than the
// installer's. Since #283 the findings ride by rule, so the app and the Clip
// say them in the reader's language too, and every line derived from a
// number or a rule reads here as it would on the reader's own phone.
//
// Everything the stranger's URL carries — the site name, the firm, the
// summary, the issues, the room names — reaches the document through
// `textContent` and never through `innerHTML`. That is not defence in depth,
// it is the only defence: the payload is bytes printed on a sticker by
// someone this page has never met.

'use strict'

;(() => {
  // STRINGS, SITE_PATHS, APP_STORE and LANGS are written in by
  // tools/build_handoff_page.py from the app catalog and the site catalog.
  const FALLBACK = 'en'

  const lang = Handoff.pickLanguage(
    navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || FALLBACK],
    LANGS)
  const table = STRINGS[lang] || STRINGS[FALLBACK]
  const plurals = new Intl.PluralRules(lang)
  const numbers = new Intl.NumberFormat(lang)

  function t(id, value) {
    const entry = table[id] !== undefined ? table[id] : STRINGS[FALLBACK][id]
    // `%1$@` and `%1$lld` are the positional spellings some translations use
    // for their one argument (Swedish writes the battery count that way).
    if (typeof entry === 'string') return value === undefined ? entry : entry.replace(/%(?:1\$)?@/, value)
    // A plural entry: CLDR categories, same as the catalog's own variations.
    const form = entry[plurals.select(value)] || entry.other
    return form.replace(/%(?:1\$)?lld/, numbers.format(value))
  }

  const el = (tag, className, text) => {
    const node = document.createElement(tag)
    if (className) node.className = className
    if (text !== undefined && text !== null && text !== '') node.textContent = text
    return node
  }

  function card(className, children) {
    const box = el('section', className)
    for (const child of children) if (child) box.appendChild(child)
    return box
  }

  // ── States ────────────────────────────────────────────────────────────────

  /// A link with nothing in it and a link we cannot read get the same words,
  /// and they are the right words for both: the commonest cause of each is a
  /// messaging app that shortened the URL on the way.
  function notice(title, body) {
    return card('notice', [
      viewfinder(),
      el('h1', 'notice-title', title),
      el('p', 'notice-body', body),
      callToAction(),
    ])
  }

  /// The Clip marks this state with `qrcode.viewfinder`; this is the same
  /// idea drawn by hand, because the page carries no icon font and fetches
  /// nothing.
  function viewfinder() {
    const NS = 'http://www.w3.org/2000/svg'
    const svg = document.createElementNS(NS, 'svg')
    svg.setAttribute('viewBox', '0 0 24 24')
    svg.setAttribute('class', 'notice-mark')
    svg.setAttribute('aria-hidden', 'true')
    const line = d => {
      const path = document.createElementNS(NS, 'path')
      path.setAttribute('d', d)
      path.setAttribute('fill', 'none')
      path.setAttribute('stroke', 'currentColor')
      path.setAttribute('stroke-width', '1.8')
      path.setAttribute('stroke-linecap', 'round')
      path.setAttribute('stroke-linejoin', 'round')
      return path
    }

    svg.appendChild(line('M3 8V4.8A1.8 1.8 0 0 1 4.8 3H8'))
    svg.appendChild(line('M16 3h3.2A1.8 1.8 0 0 1 21 4.8V8'))
    svg.appendChild(line('M21 16v3.2a1.8 1.8 0 0 1-1.8 1.8H16'))
    svg.appendChild(line('M8 21H4.8A1.8 1.8 0 0 1 3 19.2V16'))

    return card('check check-warn', [
      el('span', 'check-mark', uncheckable ? '?' : '!'),
      card('check-text', [
        el('strong', null, t(uncheckable ? 'uncheckable.title' : 'unverified.title')),
        el('span', 'check-detail', t(uncheckable ? 'uncheckable.body' : 'unverified.body')),
      ]),
    ])
  }

  /// `NetworkHealthScore.handoffSummary(score:deviceCount:)`, in the reader's
  /// language. The sentence used to travel in the payload as text, frozen in
  /// whatever language the installer's phone was set to — on a page their
  /// customer reads. The empty case is not the band's sentence: a home with no
  /// devices says so, rather than being called critical.
  ///
  /// Spelled out one case at a time rather than concatenating the tone onto a
  /// prefix, because an id built from a variable is an id the gate cannot see
  /// — and a string it cannot see is one that can quietly stop being
  /// translated. (Writing the concatenated form even in this comment was
  /// enough to trip the gate, which is the behaviour you want from it.)
  function summaryFor(payload, band) {
    if ((payload.deviceCount | 0) === 0) return t('summary.empty')
    switch (band.tone) {
      case 'a': return t('summary.a')
      case 'b': return t('summary.b')
      case 'c': return t('summary.c')
      case 'd': return t('summary.d')
      default: return t('summary.f')
    }
  }

  function grade(payload) {
    const band = Handoff.band(payload.score)
    const when = new Date(payload.inspectedAt * 1000)
    const stamp = new Intl.DateTimeFormat(lang, { dateStyle: 'long', timeStyle: 'short' }).format(when)
    const box = card('grade grade-' + band.tone, [
      typeof payload.site === 'string' ? el('h1', 'grade-site', payload.site) : null,
      el('div', 'grade-letter', band.grade),
      el('div', 'grade-score', numbers.format(payload.score) + ' / 100'),
      el('p', 'grade-summary', summaryFor(payload, band)),
      el('p', 'grade-when', t('inspected', stamp)),
      typeof payload.firm === 'string' ? el('p', 'grade-firm', payload.firm) : null,
    ])
    if (typeof payload.accepted === 'boolean') {
      box.appendChild(el('p', 'grade-accept ' + (payload.accepted ? 'is-yes' : 'is-no'),
        t(payload.accepted ? 'accepted' : 'notAccepted')))
    }
    return box
  }

  function counts(payload) {
    const row = el('div', 'tiles')
    const tile = (label, tone) => {
      const box = el('div', 'tile' + (tone ? ' tile-' + tone : ''))
      box.appendChild(el('span', 'tile-value', label))
      return box
    }
    row.appendChild(tile(t('devices', payload.deviceCount | 0)))
    row.appendChild(tile(t('routers', payload.routerCount | 0)))
    if ((payload.offlineCount | 0) > 0) row.appendChild(tile(t('offline', payload.offlineCount | 0), 'bad'))
    return row
  }

  // In the reader's language when the sticker names its rules (#283); the
  // installer's own words when it does not, or names one this page lacks.
  function issues(payload) {
    const box = card('panel', [el('h2', null, t('issues.title'))])
    const ul = el('ul', 'issues')
    const lines = Handoff.findingLines(payload, id => STRINGS[FALLBACK][id] !== undefined)
    for (const text of lines ? lines.map(([id, value]) => t(id, value)) : payload.issues) {
      ul.appendChild(el('li', null, text))
    }
    box.appendChild(ul)
    return box
  }

  function rooms(list) {
    const box = card('panel', [el('h2', null, t('rooms.title'))])
    const table = el('ul', 'rooms')
    for (const room of list) {
      const li = el('li')
      li.appendChild(el('span', 'room-name', typeof room.name === 'string' ? room.name : ''))
      const tail = el('span', 'room-counts')
      tail.appendChild(el('span', 'room-devices', t('devices', room.deviceCount | 0)))
      if ((room.offlineCount | 0) > 0) tail.appendChild(el('span', 'room-bad', t('offline', room.offlineCount | 0)))
      else if ((room.weakCount | 0) > 0) tail.appendChild(el('span', 'room-warn', t('weak', room.weakCount | 0)))
      li.appendChild(tail)
      table.appendChild(li)
    }
    box.appendChild(table)
    return box
  }

  function callToAction() {
    const a = el('a', 'cta', t('cta'))
    a.href = APP_STORE
    a.rel = 'noreferrer noopener'
    return a
  }

  function masthead() {
    const a = el('a', 'brand', 'ThreadMapper')
    const seg = SITE_PATHS[lang]
    a.href = 'https://tintronix-lab.github.io/ThreadMapper/' + (seg ? seg + '/' : '')
    a.rel = 'noreferrer noopener'
    return a
  }

  function report(result) {
    const frag = document.createDocumentFragment()
    // A sticker made on the Demo Network says so before anything else (#268).
    if (result.payload.demo === true) frag.appendChild(el('p', 'demo-mark', t('demo')))
    frag.appendChild(verification(result.verification))
    frag.appendChild(grade(result.payload))
    frag.appendChild(counts(result.payload))
    if (result.payload.issues.length) frag.appendChild(issues(result.payload))
    if (result.payload.rooms.length) frag.appendChild(rooms(result.payload.rooms))
    frag.appendChild(callToAction())
    frag.appendChild(el('p', 'footer', t('footer')))
    return frag
  }

  /// GitHub Pages serves a directory, so `/h?d=…` arrives here as a 301 to
  /// `/h/?d=…` and the address bar keeps the slash. A reader who copies that
  /// and sends it to someone who owns the app sends a link the app refuses:
  /// `HandoffCodec` matches `path == "/h"` exactly, and so does the
  /// association file. Putting the canonical path back costs one call and
  /// removes a dead end nobody would ever diagnose.
  function canonicalise() {
    if (location.pathname !== '/h/') return
    try {
      history.replaceState(null, '', '/h' + location.search + location.hash)
    } catch {
      // A file:// or sandboxed origin refuses; the page itself is unaffected.
    }
  }

  async function main() {
    document.documentElement.lang = lang
    document.title = t('title')
    canonicalise()
    const root = document.getElementById('h')
    root.textContent = ''
    root.appendChild(masthead())

    let result
    try {
      result = await Handoff.read(location.href)
    } catch {
      result = { outcome: 'failed' }
    }
    if (result.outcome === 'ok') {
      root.appendChild(report(result))
    } else if (result.outcome === 'newer') {
      root.appendChild(notice(t('newer.title'), t('newer.body')))
    } else {
      root.appendChild(notice(t('fail.title'), t('fail.body')))
    }
    document.body.dataset.state = result.outcome
  }

  main()
})()

</script>
</body>
</html>
